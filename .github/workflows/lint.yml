name: Java CI with Gradle
on:
  push:
    paths:
      - "src/**"
    branches: [ "master" ]
  pull_request:
    paths:
      - "src/**"
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Run ktlint
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 9.9.2
          arguments: ktlintCheck --scan
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Run tests
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 9.9.2
          arguments: test --scan
